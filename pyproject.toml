[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-agent"
version = "0.1.0"
description = "CLI Project Manager Agent powered by LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langchain-core>=0.2.0",
    "google-genai>=1.2.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "python-docx>=1.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
pm = "pm_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
